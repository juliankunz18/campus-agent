version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      microsoft-sdks:
        patterns: ["microsoft-agents-*", "msgraph-*", "azure-*", "openai"]
      dev-tools:
        patterns: ["pytest*", "ruff", "pyright"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directories: ["/apps/bot", "/apps/mcp"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
