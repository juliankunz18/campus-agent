name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** include real member data, tenant, site,
        group or app IDs, tokens or other secrets. Report security issues privately
        (see SECURITY.md), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Ideally with the fictional Musterverein example (`examples/musterverein`).
      placeholder: |
        1. campus-agent init
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: campus-agent version or commit.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [core, module, bot, mcp server, cli, integrations, docs, other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output with personal data removed.
      render: text
