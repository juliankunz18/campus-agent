[project]
name = "campus-agent-bot"
version = "0.1.0"
description = "Teams bot backend with the campus-agent loop"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Julian Kunz and contributors" }]
dependencies = [
    "campus-agent-core",
    "campus-agent-integrations",
    "aiohttp==3.14.3",
    "microsoft-agents-authentication-msal==1.7.0",
    "microsoft-agents-hosting-aiohttp==1.7.0",
]

[project.scripts]
campus-agent-bot = "campus_agent_bot.__main__:main"

[tool.uv.sources]
campus-agent-core = { workspace = true }
campus-agent-integrations = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"
