[project]
name = "campus-agent-cli"
version = "0.1.0"
description = "campus-agent command line: init, provision, doctor"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Julian Kunz and contributors" }]
dependencies = [
    "campus-agent-core",
    "typer==0.27.2",
]

[project.scripts]
campus-agent = "campus_agent_cli.main:app"

[tool.uv.sources]
campus-agent-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"
